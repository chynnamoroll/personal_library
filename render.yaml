services:
  - type: web
    name: personal-library-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npx knex migrate:latest && node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: personal-library-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h

databases:
  - name: personal-library-db
    plan: free
    databaseName: personal_library
    user: personal_library
